<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            width:100px;
            height:100px;
            /* background-color:red; */
            border-left:dotted blue;
            border-top:dashed red;
            border-bottom: double yellow;
            border-right: solid pink;
            
            padding:10px;
            margin-left:200px;
            margin-top:200px;
            border-radius :50%;

        }
        div:hover{
            /* transform:translateX(100px); =horizantal*/
            /* transform:translateY(200px); =vertical*/
            /* transform:translate(-300px,-200px); */
            transform:rotate(270deg) translateY(100px);
          
        }
    </style>
</head>
<body>
    <div></div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       div{
            width: 200px;
            height: 200px;
            animation-name: example; 
            animation-duration: 10s;
            animation-iteration-count: 4 ;
            animation-timing-function: ease-in-out;
            animation-delay: -2s;
            animation-direction: alternate;
            position:relative;
            background-color: burlywood;
        }
        @keyframes example {
          
            /*from{background-color: blue;}
            to{background-color: red;} */
            25%{background-color: red;transform:translate(0px,200px)rotate(0deg); }
            50%{background-color: rgb(0, 255, 157);transform:translate(200px,200px)rotate(90deg); }
            75%{background-color: rgb(198, 228, 26); transform:translate(200px,0px)rotate(90deg); }
            100%{background-color: blue; transform:translate(0px,0px)rotate(90deg); border-radius:0%} 
        }
    </style>
</head>
<body>
    <div id="practice"></div>
</body>
</html>

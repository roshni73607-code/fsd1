<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=\, initial-scale=1.0">
    <title>Document</title>
    <style>
        #image1{
            border-top-right-radius : 50%;
            border-bottom-left-radius : 50%;

            /* border-radius apply on entire image means all sides of image  */
            border: 5px solid rgb(24, 6, 6);
            max-width: 100%;
            /* height:300px;
            padding: 30px; */
            height: auto;
            max-width: 100%;
            background-color: darkblue;
           
            opacity: 0.7;
        }
        #image2{
            border-top-left-radius : 50%;
            border-bottom-right-radius : 50%;

            /* border-radius apply on entire image means all sides of image  */
            border: 5px solid rgb(24, 6, 6);
            width: 300px;
            height:300px;
            /* height: auto;
            max-width: 100%; */
            padding: 30px;
            background-color: darkblue;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <img src="sky_image.jfif" id="image1">sky_image</img>
    <img src="sky_image.jfif" id="image2">sky_image</img>
</body>
</html>

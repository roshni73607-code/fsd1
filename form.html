<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Student Registration Form</h1>
    <form action="", method="get">
        <fieldset>
            <legend>Information</legend>

            <label for="Uname">Username:</label>
            <input type="text" ,name="Username",id="Username", placeholder="Enter Username" , autofocus, autocomplete="on",
            required  maxlength="10"><br><br>

            <label for="pwd">Password:</label>
            <input type="password", name="pwd", id="pwd", placeholder="Enter Password",  maxlength="7", required><br><br>
            
            <label for="email">Email:</label>
            <input type="email", name="email", id="email", required><br><br>

            <label for="phone">Phone:</label>
            <input type="number", name="Phone", id="Phone", max="10">

            <p>Gender</p>
            <input type="radio", name="Gender" value="Male", required>Male
            <input type="radio", name="Gender" value="Female", required>Female

            <p>Hobbies</p>
            <input type="checkbox", name="hobby", value="music" checked>music
            <input type="checkbox", name="hobby", value="sport" checked>Sport
        </fieldset>

        <fieldset>
            <legend>Additional Information</legend>
            <label>Date of Birth:</label>
            <input type="date" name="dob", id="dob", min="2025-09-07" , max="2026-12-31"><br><br>
            <label>Age:</label>
            <input type="number" name="age"  id="age" min="6"  max="14"  step="1"  value="6"><br><br>

            <label>Favorite color</label>
            <input type="color", name="fcolor" id="fcolor" value="pink"><br><br>

            <label>prefered Browser</label>
            <input list="browsers" name="brws" id="brws">
            <datalist id="browsers">
                <option value="chrome"></option>
                <option value="firefox"></option>
                <option value="edge"></option>
            </datalist><br><br>

            <label>Select Branch</label>
            <select name="degree-branch" id="degree">
                <option value="select" selected disabled>Select Branch</option>
                <optgroup label="Computer">
                    <option value="CSE">CSE</option>
                    <option value="CS_IT">CS_IT</option>
                    <option value="CE">CE</option>
                    <option value="IT">IT</option>
                </optgroup>
                <optgroup label="OTHER">
                    <option value="MECH">MECH</option>
                    <option value="CIVIl">CIVIL</option>
                    <option value="EC">EC</option>
                </optgroup>
            </select>

        </fieldset>

        <fieldset>
            <legend>Feedback</legend>
            <label for="msg">Your Message:</label><br>
            <!-- <textarea id="msg"  name="msg" rows="5"  cols="6">Enter Your Message</textarea><br><br> -->
             <textarea id="msg"  name="msg" rows="5"  cols="6" placeholder="Enter Your Message"></textarea><br><br>
            <label for="Satis">Satisfaction Level:</label>
            <input type="range" name="satis" id="satis" min="5" max="50" step="5" value="25">
            <input type="hidden" name="userid" value="12345"><br><br>

            <label>Upload Your RESUME</label>
            <input type="file" name="resume" id="resume" accept=".pdf,.doc" multiple>
        </fieldset>

        <fieldset>
            <legend>Submit section</legend>
            
            <input type="submit" value="Submit Form">
            <input type="reset", value="reset">
            <button type="submit">Submit</button>

        </fieldset>

    </form>
</body>
</html>

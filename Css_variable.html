<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        :root{
            --b:blue;
            --all:solid dashed dotted double;
            --p20:20px;

        }
        p{
            --c:center;
            --b:yellow;
            border-style:var(--all);
            padding:var(--p20);
            border-color:var(--b);
        }
        h1{
            color:var(--b);
            text-align: var(--c);
        }
    </style>
</head>
<body>
    <h1>Heello!!!!</h1>
    <p>Good Morning</p>
</body>
</html>

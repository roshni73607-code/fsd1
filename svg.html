<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <svg width="200" height="300">
    <line x1="100" y1="10" x2="200" y2="200" stroke="blue" stroke-width="5"></line>
    <line x1="200" y1="10" x2="100" y2="200" stroke="blue" stroke-width="5"></line>
    <line x1="100" y1="10" x2="200" y2="10" stroke="red" stroke width="3"></line>
    <line x1="100" y1="200" x2="200" y2="200" stroke="red" stroke width="3"></line>
    <line x1="200" y1="200" x2="200" y2="10" stroke="red" stroke width="3"></line><!-- vertical -->
    <line x1="100" y1="10" x2="100" y2="200" stroke="red" stroke width="3"></line>
    </svg>

    <svg width="200" height="300">
    <!-- Triangle -->
    <line x1="0" y1="200" x2="100" y2="200" stroke="red" stroke-width="3"></line>
    <line x1="0" y1="200" x2="50" y2="0" stroke="red" stroke-width="3"></line>
    <line x1="50" y1="0" x2="100" y2="200" stroke="red" stroke-width="3"></line>
     
    </svg>
    <svg width="100" height="100" style="border: 5px solid rgb(0, 0, 0)">
    <circle cx="50" cy="50" r="40" stroke="red" stroke-width="5" fill="yellow"></circle>
    
    </svg>

    </svg>
    <svg width="100" height="100" style="border: 5px solid rgb(0, 0, 0)">
    <circle cx="0" cy="0" r="40" stroke="red" stroke-width="5" fill="yellow"></circle>
    <circle cx="100" cy="0" r="40" stroke="red" stroke-width="5" fill="yellow"></circle>
    <circle cx="0" cy="100" r="40" stroke="red" stroke-width="5" fill="yellow"></circle>
    <circle cx="100" cy="100" r="40" stroke="red" stroke-width="5" fill="yellow"></circle>
    <circle cx="50" cy="50" r="20" stroke="yellow" stroke-width="5" fill="red"></circle>
    </svg>

    <svg width="400" height="120" style="border: 3px solid rgb(216, 54, 13)">
    <rect  x="50" y="20" rx="200" ry="50" width="300" height="100" stroke="red" stroke-width="3"></rect>
    <!-- <rect x="50" y="50" width="300" height="100" stroke="red" stroke-width="3"></rect> -->
    </svg>

    <svg width="400" height="120" style="border: 3px solid rgb(216, 56, 12)">
    <ellipse cx="200" cy="60" rx="100" ry="50" stroke="red" stroke-width="3" fill="blue"></ellipse>
    </svg>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
           
            /* background-color:red; */
            border:2px solid;
            background-color: blanchedalmond;
            padding:10px;
            margin-top: 100px;
            margin-left: 100px;
            width: 200px;
            height: 200px;
            transition-duration: 5s;
            transition-delay: 2s;
            background-image: url(sky_image.jfif);
            transition-timing-function: ease ease-in;
            /* ease in /ease out/ease in out/ease */

        }
        div:hover{
            
            border-top:6px dashed red;
            border-bottom: 7px double rgb(72, 27, 179);
            border-right:5px  solid pink;
            
            padding:10px;
            margin-left:200px;
            margin-top:200px;
            border-radius :50%;
            
            transform:rotate(270deg) translateY(100px);
        }
    </style>
</head>
<body>
    <div></div>
</body>
</html>
